# Build and code-sign a MechApe release.
#
# Signing is done by SignPath Foundation, which gives OSS projects a free
# code-signing certificate. Rationale and setup: docs/SIGNING.md.
#
# SignPath will only sign artifacts it can trace to a trusted build — it
# pulls the artifact from this workflow run via the GitHub API rather than
# accepting an upload. That is why the build must happen here and not on a
# developer's machine.
#
# WHAT GETS SIGNED, AND WHY IT IS SO LITTLE
#
# The SignPath Foundation code of conduct says a project may sign only
# artifacts built from its own source, and that upstream OSS binaries must
# be shipped *unsigned* inside the signed package. Almost nothing in this
# package qualifies as ours:
#
#   MechApe.exe            our build's Electron host         -> signed
#   the NSIS installer     produced by our build             -> signed
#   resources/runtime/**   llama.cpp, verbatim from ggml-org -> NOT ours
#   ffmpeg.dll, libGLESv2.dll, vk_swiftshader.dll, …
#                          Chromium/Electron upstream        -> NOT ours
#   resources/app/**       our code, but it is JavaScript — nothing to sign
#
# An earlier revision globbed **/*.exe;**/*.dll over the whole unpacked
# tree, which would have signed the entire llama.cpp runtime — precisely
# what the policy forbids.
#
# Note what this does NOT fix: llama-server.exe is the binary antivirus
# actually quarantines, and it is upstream, so it ships unsigned and stays
# exposed. Signing removes the SmartScreen warning on the installer and on
# the app itself. The real fix for the runtime is upstream signing.
#
# Only Windows is signed. macOS needs an Apple Developer ID (not a SignPath
# concern) and Linux AppImages are not code-signed at all, so those two
# publish unsigned and say so.
#
# Until the SignPath application is approved, SIGNPATH_API_TOKEN will not
# exist and both passes are skipped: the workflow still builds and still
# publishes, just unsigned and labelled as such. That keeps releases
# possible while the application is pending — which matters, because their
# conditions require a project already be released before they will
# consider it.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub release (otherwise just build artifacts)'
        type: boolean
        default: false

permissions:
  contents: write   # create the release and upload assets to it
  actions: read     # SignPath fetches the build artifact through this

env:
  # electron-builder must not try to sign locally — there is no certificate
  # on the runner, and its auto-discovery otherwise emits confusing warnings.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    strategy:
      # One platform failing should not deny us the other two — a broken mac
      # build is not a reason to lose a working Windows installer.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    # Generous because SignPath requires a human to approve each signing
    # request, and the Windows leg waits on two of them. The build itself
    # takes under five minutes.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Run on every platform, not just one: lint and the adapter tests cover
      # path handling, which is exactly where the three diverge.
      - name: Lint and test
        run: npm test

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "version $pkg"

      # Downloads the pinned llama.cpp builds for THIS platform and verifies
      # each against the SHA256 digest GitHub reports for the asset.
      # scripts/fetch-runtime.js picks the right set from process.platform.
      - name: Fetch and verify the llama.cpp runtime
        run: npm run runtime

      # ---- macOS and Linux: one build, no signing ----

      - name: Build (macOS)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish never

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never

      # ---- Windows: unpacked app, sign, then package ----

      # Stage 1 — unpacked app only. buildDate is baked in here because
      # extraMetadata rewrites the packaged package.json, which stage 2
      # (--prepackaged) no longer touches.
      - name: Build the unpacked app (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: npx electron-builder --win --dir -c.extraMetadata.buildDate=$(date -u +%Y-%m-%d)

      # The token goes through the environment rather than being interpolated
      # into the command line: ${{ secrets.* }} in a `run:` string is expanded
      # before the shell ever sees it, which puts the value in the process
      # arguments. Masking hides it from the log, not from the process table.
      - name: Detect whether signing is configured
        if: matrix.platform == 'win'
        id: signing
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SIGNPATH_API_TOKEN is not set — publishing UNSIGNED. See docs/SIGNING.md."
          fi

      # ---- pass 1: the app executable, on its own ----
      # Submitted as a bare PE rather than a zip of the tree: the tree is
      # mostly upstream binaries we are not permitted to sign, and naming the
      # one file we may sign makes that impossible to get wrong by accident.

      - name: Upload the app executable for SignPath
        if: matrix.platform == 'win' && steps.signing.outputs.enabled == 'true'
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: mechape-exe-unsigned
          path: dist/win-unpacked/MechApe.exe
          retention-days: 1

      - name: Sign the app executable
        if: matrix.platform == 'win' && steps.signing.outputs.enabled == 'true'
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: application
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          # A signing request needs manual approval in the SignPath UI, so
          # this step blocks on a human. The job timeout is sized for that.
          wait-for-completion: true
          output-artifact-directory: signed-app

      # Put the signed executable back before the installer is built, so the
      # installer packages the signed copy.
      - name: Replace the executable with its signed copy
        if: matrix.platform == 'win' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed-app -Recurse -Filter MechApe.exe | Select-Object -First 1
          if (-not $signed) { throw "SignPath returned no MechApe.exe in signed-app/" }
          Copy-Item $signed.FullName dist/win-unpacked/MechApe.exe -Force

          # Confirm the round-trip actually produced a signature rather than
          # assuming it did.
          $sig = Get-AuthenticodeSignature dist/win-unpacked/MechApe.exe
          "MechApe.exe: $($sig.Status) — $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "MechApe.exe is not validly signed: $($sig.Status)" }

      - name: Build the installer (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win nsis --prepackaged dist/win-unpacked

      - name: Find the installer
        if: matrix.platform == 'win'
        id: installer
        shell: bash
        run: echo "path=$(ls dist/*.exe | head -1)" >> "$GITHUB_OUTPUT"

      # ---- pass 2: sign the installer itself ----

      - name: Upload installer for SignPath
        if: matrix.platform == 'win' && steps.signing.outputs.enabled == 'true'
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: mechape-installer-unsigned
          path: ${{ steps.installer.outputs.path }}
          retention-days: 1

      - name: Sign the installer
        if: matrix.platform == 'win' && steps.signing.outputs.enabled == 'true'
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      # ---- collect this platform's shippable files ----

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          case "${{ matrix.platform }}" in
            win)
              if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
                cp signed-installer/*.exe out/
              else
                cp "${{ steps.installer.outputs.path }}" out/
              fi
              ;;
            mac)   cp dist/*.dmg dist/*.zip out/ ;;
            linux) cp dist/*.AppImage out/ ;;
          esac
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: mechape-${{ matrix.platform }}
          path: out/*
          retention-days: 7

  # A single job publishes, after every platform has built. Letting each
  # matrix leg create the release itself races: three runners would try to
  # create the same tag's release at once.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Download every platform's artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mechape-*
          path: staging
          merge-multiple: true

      # SHA256 lets people verify a download independently of any signature —
      # which matters most for the platforms that have none.
      - name: Checksum
        run: |
          cd staging
          sha256sum * | tee SHA256SUMS.txt
          ls -la

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: staging/*
          draft: true
          generate_release_notes: true
          body: |
            Verify any download against `SHA256SUMS.txt`.

            **Windows** — signed by SignPath Foundation once the application clears; until then the installer is unsigned and SmartScreen will warn on first launch.
            **macOS** — unsigned (no Apple Developer ID). Gatekeeper will block the first launch: right-click the app → **Open**, or allow it under System Settings → Privacy & Security.
            **Linux** — AppImage, `chmod +x` and run.

            The bundled llama.cpp runtime is upstream and ships unsigned on every platform, by SignPath Foundation policy. See [docs/SIGNING.md](https://github.com/codalanguez/MechApe/blob/main/docs/SIGNING.md).
